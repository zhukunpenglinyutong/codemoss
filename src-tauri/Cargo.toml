[package]
name = "cc-gui"
version = "0.3.0"
description = "CodePort desktop application"
authors = ["you"]
edition = "2021"
default-run = "cc-gui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "unstable", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
log = "0.4"
tokio = { version = "1", features = ["fs", "net", "io-util", "process", "rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
git2 = "0.20.3"
notify = "6"
base64 = "0.22"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
ignore = "0.4.25"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
# flate2 1.1.8 requires an explicit backend; zip pulls it in with default-features off,
# so select rust_backend (miniz_oxide, no system zlib) here for the target build.
flate2 = { version = "1", features = ["rust_backend"] }
axum = { version = "0.7", features = ["ws"] }
libc = "0.2"
chrono = { version = "0.4", features = ["clock"] }
shell-words = "1.1"
toml = "0.8"
dirs = "5"
which = "7"
trash = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
hmac = "0.12"
chardetng = "0.1"
encoding_rs = "0.8"
lettre = { version = "0.11.21", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls", "hostname"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
mailparse = "0.16.1"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"

[target."cfg(not(target_os = \"windows\"))".dependencies]
cpal = "0.15"
whisper-rs = "0.12"

[target."cfg(target_os = \"windows\")".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSResponder", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"

# Binary size: strip + fat LTO + size-biased opt (whisper.cpp C code keeps its own -O3).
# No panic="abort": tokio task isolation relies on unwinding; a task panic must not kill the app.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
