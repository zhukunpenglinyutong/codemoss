name: Build Windows Test Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - fix/codex-queued-message-order

permissions:
  contents: read

jobs:
  build_windows:
    name: windows test installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-bin: false
          shared-key: codex-queued-message-order-test
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run tauri -- build --config src-tauri/tauri.windows.test.conf.json --bundles nsis

      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: ccgui-windows-test-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
